; EIAAW Workforce — php-fpm pool behind nginx (see deploy/nginx.conf.template).
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; Railway injects configuration as environment variables; keep them visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
