<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="jb-title jb-desc" preserveAspectRatio="xMidYMid meet">
  <title id="jb-title">The automated employee journey</title>
  <desc id="jb-desc">A vertical flow diagram: invite link drops into a unified record, which fans out to HR, IT and Finance.</desc>

  <defs>
    <linearGradient id="jb-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8A5"/>
      <stop offset="100%" stop-color="#11766A"/>
    </linearGradient>
    <linearGradient id="jb-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF8F1"/>
    </linearGradient>
    <filter id="jb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Vertical connector line behind everything -->
  <path d="M 160 28 L 160 252"
        stroke="#22B8A5" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-dasharray="2 5" opacity="0.45"/>

  <!-- Top node · INVITE -->
  <g filter="url(#jb-shadow)">
    <rect x="80" y="14" width="160" height="44" rx="22" fill="url(#jb-card)" stroke="#E6DFCF" stroke-width="1"/>
    <circle cx="106" cy="36" r="11" fill="url(#jb-teal)"/>
    <path d="M 102 36 L 105 39 L 111 33" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="33" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F1A1D">Invite link</text>
    <text x="124" y="46" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#7B8A8F">Filled once · Section A–I</text>
  </g>

  <!-- Mid node · UNIFIED RECORD (the heart) -->
  <g filter="url(#jb-shadow)">
    <rect x="56" y="98" width="208" height="56" rx="14" fill="#FFFFFF" stroke="#11766A" stroke-width="1.2"/>
    <text x="160" y="118" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="7.5" fill="#9CA8AC" letter-spacing="0.16em" text-anchor="middle">EMPLOYEE RECORD</text>
    <text x="160" y="138" font-family="'Instrument Serif', Georgia, serif" font-size="18" font-style="italic" fill="#11766A" text-anchor="middle">activated.</text>
  </g>

  <!-- Branching connectors from record to 3 pillars -->
  <g stroke="#22B8A5" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M 95 154 Q 70 180 60 218" stroke-linecap="round"/>
    <path d="M 160 154 L 160 218" stroke-linecap="round"/>
    <path d="M 225 154 Q 250 180 260 218" stroke-linecap="round"/>
  </g>

  <!-- 3 pillar pills · HR / IT / FIN -->
  <g filter="url(#jb-shadow)">
    <!-- HR -->
    <rect x="20" y="218" width="80" height="44" rx="11" fill="url(#jb-card)" stroke="#E6DFCF" stroke-width="1"/>
    <rect x="30" y="228" width="22" height="22" rx="6" fill="url(#jb-teal)"/>
    <path d="M 36 239 L 39 242 L 46 235" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="240" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#11766A">HR</text>
    <text x="58" y="252" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#7B8A8F">People</text>

    <!-- IT -->
    <rect x="120" y="218" width="80" height="44" rx="11" fill="url(#jb-card)" stroke="#E6DFCF" stroke-width="1"/>
    <rect x="130" y="228" width="22" height="22" rx="6" fill="url(#jb-teal)"/>
    <rect x="134" y="232" width="14" height="10" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <rect x="137" y="244" width="8"  height="2"  rx="0.5" fill="#FFFFFF"/>
    <text x="158" y="240" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#11766A">IT</text>
    <text x="158" y="252" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#7B8A8F">Assets</text>

    <!-- FIN -->
    <rect x="220" y="218" width="80" height="44" rx="11" fill="url(#jb-card)" stroke="#E6DFCF" stroke-width="1"/>
    <rect x="230" y="228" width="22" height="22" rx="6" fill="url(#jb-teal)"/>
    <path d="M 235 244 L 238 240 L 242 242 L 247 235" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="258" y="240" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#11766A">FIN</text>
    <text x="258" y="252" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#7B8A8F">Books</text>
  </g>
</svg>
