<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="card-title card-desc" preserveAspectRatio="xMidYMid meet">
  <title id="card-title">One click runs HR, IT, and Finance in parallel</title>
  <desc id="card-desc">A close-up of the EIAAW Workforce command palette: a single Run button cascades into three concurrent workflows — onboarding in HR, asset provisioning in IT, and ledger posting in Finance.</desc>

  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1A1D"/>
      <stop offset="100%" stop-color="#162428"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8A5"/>
      <stop offset="100%" stop-color="#11766A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22B8A5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22B8A5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="360" rx="20" fill="url(#card-bg)"/>
  <ellipse cx="160" cy="100" rx="180" ry="80" fill="url(#glow)"/>

  <!-- Status row -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9" letter-spacing="0.14em">
    <circle cx="28" cy="32" r="4" fill="#22B8A5"/>
    <text x="40" y="36" fill="#22B8A5">LIVE · ASSISTANT READY</text>
    <text x="240" y="36" fill="#7B8A8F">14:32 UTC+8</text>
  </g>

  <!-- Headline -->
  <text x="28" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" letter-spacing="-0.01em">Run today's operations</text>
  <text x="28" y="98" font-family="'Instrument Serif', Georgia, serif" font-size="22" font-style="italic" fill="#22B8A5" letter-spacing="-0.02em">— in one click.</text>

  <!-- Run button (the moment) -->
  <rect x="28" y="116" width="264" height="56" rx="14" fill="url(#teal2)"/>
  <rect x="28" y="116" width="264" height="56" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="160" y="150" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run organisation →</text>

  <!-- Cursor on the button -->
  <g transform="translate(214, 138)">
    <path d="M0 0 L0 18 L5 14 L8 21 L11 20 L8 13 L14 13 Z" fill="#FFFFFF" stroke="#0F1A1D" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Cascade label -->
  <text x="28" y="200" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9" letter-spacing="0.14em" fill="#7B8A8F">FIRES IN PARALLEL</text>

  <!-- Three cascading workflow rows -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E8ECEC">
    <!-- HR row -->
    <rect x="28" y="216" width="264" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="46" cy="233" r="8" fill="#22B8A5" fill-opacity="0.18"/>
    <text x="46" y="237" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#22B8A5" text-anchor="middle">HR</text>
    <text x="64" y="233" fill="#FFFFFF">Onboard 3 hires</text>
    <text x="64" y="245" font-size="9" fill="#9CA8AC">activate · welcome · cascade records</text>
    <circle cx="278" cy="233" r="6" fill="#22B8A5"/>
    <path d="M275 233 L277.5 235.5 L281 231" stroke="#0F1A1D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- IT row -->
    <rect x="28" y="258" width="264" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="46" cy="275" r="8" fill="#22B8A5" fill-opacity="0.18"/>
    <text x="46" y="279" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#22B8A5" text-anchor="middle">IT</text>
    <text x="64" y="275" fill="#FFFFFF">Provision 6 assets</text>
    <text x="64" y="287" font-size="9" fill="#9CA8AC">assign · auto-AARF · audit trail</text>
    <circle cx="278" cy="275" r="6" fill="#22B8A5"/>
    <path d="M275 275 L277.5 277.5 L281 273" stroke="#0F1A1D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Finance row -->
    <rect x="28" y="300" width="264" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="46" cy="317" r="8" fill="#22B8A5" fill-opacity="0.18"/>
    <text x="46" y="321" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#22B8A5" text-anchor="middle">FIN</text>
    <text x="64" y="317" fill="#FFFFFF">Post 7 claims to GL</text>
    <text x="64" y="329" font-size="9" fill="#9CA8AC">approve · journal · reconcile</text>
    <circle cx="278" cy="317" r="6" fill="#22B8A5"/>
    <path d="M275 317 L277.5 319.5 L281 315" stroke="#0F1A1D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
