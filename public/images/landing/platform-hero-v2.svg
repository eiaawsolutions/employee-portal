<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="hero-title hero-desc" preserveAspectRatio="xMidYMid meet">
  <title id="hero-title">EIAAW Workforce — run an entire organisation in one click</title>
  <desc id="hero-desc">Product dashboard preview showing three departments (HR, IT, Finance) running in parallel from a single command palette on the EIAAW Workforce platform.</desc>

  <defs>
    <linearGradient id="bg-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3EDE0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8A5"/>
      <stop offset="100%" stop-color="#11766A"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="540" rx="20" fill="url(#bg-warm)"/>

  <!-- Browser chrome -->
  <rect x="32" y="32" width="656" height="476" rx="14" fill="#FFFFFF" stroke="#E6DFCF" stroke-width="1"/>
  <rect x="32" y="32" width="656" height="36" rx="14" fill="#F8F3E8"/>
  <rect x="32" y="60" width="656" height="8" fill="#F8F3E8"/>
  <circle cx="52" cy="50" r="5" fill="#E0BFA0"/>
  <circle cx="70" cy="50" r="5" fill="#EAD9B8"/>
  <circle cx="88" cy="50" r="5" fill="#C8E0CF"/>
  <rect x="120" y="42" width="240" height="16" rx="8" fill="#FFFFFF" stroke="#E6DFCF" stroke-width="1"/>
  <text x="132" y="53" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="9" fill="#7B8A8F" letter-spacing="0.05em">acme.eiaawsolutions.com</text>

  <!-- Sidebar -->
  <rect x="32" y="68" width="160" height="440" fill="#FAF7F2"/>
  <rect x="32" y="68" width="160" height="440" fill="none" stroke="#E6DFCF" stroke-width="1"/>

  <!-- Logo lockup -->
  <rect x="48" y="84" width="22" height="22" rx="6" fill="url(#teal)"/>
  <path d="M54 95 L58 99 L66 91" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F1A1D">EIAAW</text>
  <text x="78" y="105" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#7B8A8F" letter-spacing="0.1em">WORKFORCE</text>

  <!-- Sidebar nav -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#3F4F54">
    <rect x="48" y="132" width="128" height="24" rx="6" fill="#1FA896" opacity="0.10"/>
    <circle cx="60" cy="144" r="2" fill="#11766A"/>
    <text x="70" y="147" fill="#11766A" font-weight="600">Overview</text>

    <text x="60" y="178" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#9CA8AC" letter-spacing="0.12em">HR</text>
    <text x="60" y="196">Onboarding</text>
    <text x="60" y="212">Employees</text>
    <text x="60" y="228">Leave</text>
    <text x="60" y="244">Payroll</text>
    <text x="60" y="260">EA Forms</text>

    <text x="60" y="288" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#9CA8AC" letter-spacing="0.12em">IT</text>
    <text x="60" y="306">Asset Inventory</text>
    <text x="60" y="322">AARF</text>
    <text x="60" y="338">Provisioning</text>

    <text x="60" y="366" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#9CA8AC" letter-spacing="0.12em">FINANCE</text>
    <text x="60" y="384">General Ledger</text>
    <text x="60" y="400">Invoices</text>
    <text x="60" y="416">Claims</text>
    <text x="60" y="432">Reports</text>
  </g>

  <!-- Main canvas header — bulletproof: 3 separate <text> elements, no font-switch tspans -->
  <text x="216" y="92" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9CA8AC" letter-spacing="0.14em" text-anchor="start">DASHBOARD · TODAY</text>
  <text x="216" y="116" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#0F1A1D" letter-spacing="-0.02em" text-anchor="start">Run your organisation</text>
  <text x="216" y="138" font-family="'Instrument Serif', Georgia, serif" font-size="19" font-style="italic" fill="#11766A" letter-spacing="-0.02em" text-anchor="start">in one click.</text>

  <!-- Three module cards -->
  <g filter="url(#soft-shadow)">
    <rect x="216" y="158" width="148" height="120" rx="12" fill="#FFFFFF" stroke="#EDE5D2" stroke-width="1"/>
    <rect x="228" y="170" width="22" height="22" rx="6" fill="#1FA896" opacity="0.14"/>
    <text x="239" y="186" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#11766A" text-anchor="middle">HR</text>
    <text x="228" y="210" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9CA8AC" letter-spacing="0.1em" text-anchor="start">ACTIVE EMPLOYEES</text>
    <text x="228" y="232" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#0F1A1D" letter-spacing="-0.02em" text-anchor="start">142</text>
    <text x="228" y="255" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">Payroll · 3 days</text>
    <text x="228" y="268" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">Leave queue · 4</text>

    <rect x="372" y="158" width="148" height="120" rx="12" fill="#FFFFFF" stroke="#EDE5D2" stroke-width="1"/>
    <rect x="384" y="170" width="22" height="22" rx="6" fill="#1FA896" opacity="0.14"/>
    <text x="395" y="186" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#11766A" text-anchor="middle">IT</text>
    <text x="384" y="210" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9CA8AC" letter-spacing="0.1em" text-anchor="start">ASSETS DEPLOYED</text>
    <text x="384" y="232" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#0F1A1D" letter-spacing="-0.02em" text-anchor="start">318</text>
    <text x="384" y="255" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">AARF pending · 2</text>
    <text x="384" y="268" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">Returns · 1</text>

    <rect x="528" y="158" width="148" height="120" rx="12" fill="#FFFFFF" stroke="#EDE5D2" stroke-width="1"/>
    <rect x="540" y="170" width="22" height="22" rx="6" fill="#1FA896" opacity="0.14"/>
    <text x="551" y="186" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#11766A" text-anchor="middle">FIN</text>
    <text x="540" y="210" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9CA8AC" letter-spacing="0.1em" text-anchor="start">MONTH-TO-DATE</text>
    <text x="540" y="232" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#0F1A1D" letter-spacing="-0.02em" text-anchor="start">RM 412k</text>
    <text x="540" y="255" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">Invoices · 24</text>
    <text x="540" y="268" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#3F4F54" text-anchor="start">Claims · 7</text>
  </g>

  <!-- Activity stream — every line a separate <text>, no inline font-switch tspans for the names. -->
  <text x="216" y="304" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9CA8AC" letter-spacing="0.14em" text-anchor="start">LIVE ACTIVITY</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#3F4F54">
    <circle cx="222" cy="324" r="3" fill="#1FA896"/>
    <text x="234" y="327" text-anchor="start">New hire Aisha Rahman activated · welcome email sent · IT auto-provisioned 2 assets</text>

    <circle cx="222" cy="346" r="3" fill="#1FA896"/>
    <text x="234" y="349" text-anchor="start">Expense claim CL-2891 approved · auto-posted to GL · journal entry created</text>

    <circle cx="222" cy="368" r="3" fill="#1FA896"/>
    <text x="234" y="371" text-anchor="start">AARF acknowledged by Daniel Lim · MacBook Pro · asset locked to employee record</text>

    <circle cx="222" cy="390" r="3" fill="#1FA896"/>
    <text x="234" y="393" text-anchor="start">Payroll preview ready · 142 employees · EPF / SOCSO / EIS / PCB calculated</text>

    <circle cx="222" cy="412" r="3" fill="#22B8A5"/>
    <text x="234" y="415" text-anchor="start">Offboarding queued · IT asset return · final payroll · clearance certificate</text>
  </g>

  <!-- Command palette anchored at bottom -->
  <g filter="url(#soft-shadow)">
    <rect x="216" y="436" width="460" height="56" rx="14" fill="url(#card-glass)" stroke="#11766A" stroke-width="1"/>
    <circle cx="240" cy="464" r="10" fill="url(#teal)"/>
    <path d="M236 464 L239 467 L245 461" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260" y="460" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F1A1D" text-anchor="start">Run today's operations</text>
    <text x="260" y="475" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#7B8A8F" text-anchor="start">Onboard · Provision · Pay · Reconcile · Close — one click</text>
    <rect x="572" y="448" width="92" height="32" rx="9" fill="url(#teal)"/>
    <text x="618" y="468" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run →</text>
  </g>
</svg>
