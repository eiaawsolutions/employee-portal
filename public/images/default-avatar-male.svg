    <!-- Mouth -->
    <path d="M92 135 Q100 140 108 135" fill="none" stroke="#b07850" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Ears -->
    <ellipse cx="64" cy="112" rx="6" ry="8" fill="#d4a574"/>
    <ellipse cx="136" cy="112" rx="6" ry="8" fill="#d4a574"/>
