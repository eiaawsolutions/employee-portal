    <path d="M96 170 L100 200 L104 170" fill="#dc2626"/>
    <path d="M94 168 L100 175 L106 168" fill="#dc2626"/>
    <!-- Neck -->
    <rect x="88" y="140" width="24" height="30" rx="6" fill="#d4a574"/>
    <!-- Head -->
    <ellipse cx="100" cy="110" rx="36" ry="42" fill="#d4a574"/>
    <!-- Hair -->
    <path d="M64 95 Q65 60 100 55 Q135 60 136 95 Q132 75 100 70 Q68 75 64 95 Z" fill="#2d1f14"/>
    <!-- Hair sides -->
    <path d="M64 95 Q62 85 66 75 Q64 90 66 95 Z" fill="#2d1f14"/>
