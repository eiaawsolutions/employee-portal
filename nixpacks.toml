[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_pgsql", "php82Extensions.pgsql", "php82Extensions.gd", "php82Extensions.intl", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.redis", "nodejs_22", "postgresql"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache"
]

[start]
# Migrations first (idempotent), then start the server. The Procfile has
# the same shape but Nixpacks ignores Procfile when nixpacks.toml exists.
cmd = "php artisan migrate --force && php -d variables_order=EGPCS -S 0.0.0.0:$PORT -t public"
